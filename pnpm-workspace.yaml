# The desktop app is a single-project install. `mobile/` is a separate workspace
# with its own pnpm-workspace.yaml and lockfile, so keep it out of the root
# package graph. Without this file `pnpm -r` auto-discovers mobile/ and its
# nested package, and the root's patchedDependencies fail as ERR_PNPM_UNUSED_PATCH.
packages: []

# pnpm 10 reads all settings from pnpm-workspace.yaml; the package.json "pnpm"
# field is no longer read (https://pnpm.io/settings).
overrides:
  monaco-editor>dompurify: 3.4.13

supportedArchitectures:
  os:
    - current
    - darwin
    - linux
    - win32
  cpu:
    - current
    - x64
    - arm64

# Legacy .npmrc settings. pnpm 11 stops reading shamefully-hoist and
# minimum-release-age from .npmrc (https://pnpm.io/11.x/release-notes); both
# are kept explicit so the install stays deterministic across versions.
# - shamefullyHoist: true keeps node_modules flat so unscoped requires like
#   `@electron/get` resolve from the project root. (See commit adding
#   `@electron/get` to devDependencies for the long-term fix path.)
# - minimumReleaseAge: 4320 hours (~6 months) is a deliberate supply-chain
#   policy and not a default we are inheriting.
shamefullyHoist: true
minimumReleaseAge: 4320

allowBuilds:
  '@parcel/watcher': true
  cpu-features: true
  esbuild: true
  node-pty: true
  sherpa-onnx: true
  # Explicitly denied: skipped today by omission; pnpm 11's strictDepBuilds
  # default needs each denied package named, or the install hard-fails.
  '@swc/core': false
  '@vscode/windows-process-tree': false
  agent-browser: false
  electron-winstaller: false
  msw: false
  ssh2: false
  windows-native-registry: false

patchedDependencies:
  node-pty@1.1.0: config/patches/node-pty@1.1.0.patch
  '@xterm/addon-ligatures@0.11.0-beta.287': config/patches/@xterm__addon-ligatures@0.11.0-beta.287.patch
  '@xterm/addon-webgl@0.20.0-beta.286': config/patches/@xterm__addon-webgl@0.20.0-beta.286.patch
  '@xterm/addon-serialize@0.15.0-beta.287': config/patches/@xterm__addon-serialize@0.15.0-beta.287.patch
  '@xterm/xterm@6.1.0-beta.287': config/patches/@xterm__xterm@6.1.0-beta.287.patch
  lint-staged@16.4.0: config/patches/lint-staged@16.4.0.patch
  '@vscode/windows-process-tree@0.8.0': config/patches/@vscode__windows-process-tree@0.8.0.patch
